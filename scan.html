<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Balino Gym - Attendance Scanner</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="scan.css" />
  </head>
  <body>
    <div class="scan-wrapper">
      <div class="scan-header">
        <h1>Balino Gym</h1>
        <p>Attendance Scanner</p>
        <div class="scan-back-buttons">
          <a href="member_dashboard.html" class="btn-back">
            <i class="bi bi-person-fill"></i> Member Dashboard
          </a>
          <a href="dashboard.html" class="btn-back">
            <i class="bi bi-people-fill"></i> Staff Dashboard
          </a>
        </div>
      </div>

      <div class="scan-card">
        <!-- Camera view -->
        <!-- add this below the scanner view -->
        <div id="scannerView">
          <div class="reader-wrapper">
            <video id="reader" style="width: 100%; border-radius: 12px"></video>
            <div class="scan-overlay">
              <div class="scan-box">
                <span></span>
                <div class="scan-line"></div>
              </div>
            </div>
          </div>
          <p class="scan-tip">Point the camera at your QR code</p>

          <div class="manual-input">
            <p class="manual-label">Or enter ID manually</p>
            <div class="manual-row">
              <input
                type="text"
                id="manualId"
                placeholder="e.g. M001 or S001"
              />
              <button onclick="manualScan()">Submit</button>
            </div>
          </div>
        </div>

        <!-- Result view (shown after scan) -->
        <div id="resultView" style="display: none">
          <div id="resultIcon"></div>
          <h3 id="resultName"></h3>
          <p id="resultAction"></p>
          <p id="resultTime" class="result-time"></p>
          <button onclick="resetScanner()" class="btn-scan-again">
            <i class="bi bi-qr-code-scan"></i> Scan Again
          </button>
        </div>
      </div>

      <div class="scan-footer">
        <p id="currentTime"></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.19.1/umd/index.min.js"></script>
    <script src="scan.js"></script>
  </body>
</html>
